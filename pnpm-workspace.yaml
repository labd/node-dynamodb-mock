minimumReleaseAge: 20160 # 14 days
# Locked versions younger than 14 days when moving to pnpm 12; drop once they are older (after 2026-11-05).
minimumReleaseAgeExclude:
  - "postcss@8.5.31"
# Build scripts were never run under pnpm 10 either (ignored by default);
# keep that behaviour explicit.
allowBuilds:
  classic-level: false # ships prebuilt binaries, install script only rebuilds as fallback
  esbuild: false # postinstall only verifies the platform binary
  msw: false # postinstall only copies the service worker into a public dir
